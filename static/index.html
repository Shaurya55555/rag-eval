<!doctype html>
<meta charset="utf-8"><title>rag-eval demo</title>
<style>
body{font:15px system-ui;max-width:820px;margin:32px auto;padding:0 16px;color:#1a1a1a}
input{width:70%;padding:8px}button{padding:8px 14px}
.ans{background:#f4f6f8;padding:12px;border-radius:6px;margin:14px 0;white-space:pre-wrap}
.src{border-left:3px solid #888;padding:4px 10px;margin:8px 0;font-size:13px;color:#444}
small{color:#777}
</style>
<h2>Docs Q&amp;A <small>(Qdrant + FastAPI docs, reranked, cited)</small></h2>
<input id=q placeholder="Ask about Qdrant or FastAPI..." onkeydown="if(event.key=='Enter')ask()">
<button onclick=ask()>Ask</button>
<label><input type=checkbox id=rr checked style="width:auto"> rerank</label>
<div id=out></div>
<script>
async function ask(){
  const out=document.getElementById('out');out.textContent='...';
  const r=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({question:q.value,rerank:rr.checked})});
  const d=await r.json();
  out.innerHTML='';
  const a=document.createElement('div');a.className='ans';a.textContent=d.answer;out.append(a);
  d.contexts.forEach((c,i)=>{const s=document.createElement('div');s.className='src';
    s.textContent='['+(i+1)+'] '+c.chunk_id+': '+c.text.slice(0,300)+'...';out.append(s)});
}
</script>
